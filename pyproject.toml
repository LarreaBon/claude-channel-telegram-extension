[project]
name = "claude-channel-telegram-extension"
version = "0.1.0"
description = "Inline keyboard + reply_to + callback_query handler patches for Claude Code telegram plugin"
authors = [{name = "LarreaBon"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
